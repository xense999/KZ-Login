name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: npm ci

      # 只 build，不建 release —— 上傳前要先改掉中文檔名
      - name: Build
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # productName 是中文，而 GitHub 上傳 asset 會砍掉非 ASCII 字元
      - name: Rename installer to ASCII
        id: installer
        shell: pwsh
        run: |
          $found = @(Get-ChildItem "src-tauri/target/release/bundle/nsis/*_x64-setup.exe")
          if ($found.Count -ne 1) { throw "expected exactly 1 installer, found $($found.Count)" }
          $newName = "KuZe-Login_$($found[0].Name -replace '^.+?_')"
          Rename-Item $found[0].FullName $newName
          "path=$($found[0].DirectoryName)\$newName" >> $env:GITHUB_OUTPUT

      # 更新說明放 release-notes/<tag>.md（跟著 tag 一起進 repo）。忘了寫就退回
      # 一句下載指示——寧可 release 內容陽春，也不要卡住整個發版。
      - name: Resolve release notes
        id: notes
        shell: pwsh
        run: |
          $path = "release-notes/${{ github.ref_name }}.md"
          if (-not (Test-Path $path)) {
            Write-Host "::warning::$path 不存在，改用預設內文"
            $path = "release-notes/_default.md"
          }
          "path=$path" >> $env:GITHUB_OUTPUT

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          name: 久世登入器 ${{ github.ref_name }}
          body_path: ${{ steps.notes.outputs.path }}
          draft: false
          prerelease: false
          files: ${{ steps.installer.outputs.path }}

      # 裸執行檔給「程式內更新」就地置換用（安裝目錄裡只有這顆 exe）。
      #
      # 必須在 Release 之後單獨上傳，不能併進上面的 files：v1.2.2 以前的版本挑
      # 更新檔的規則是「第一個 .exe asset」，而 GitHub 是照 asset id（也就是上傳
      # 順序）回傳的。安裝檔先上傳，舊版才會繼續抓到安裝檔而不是這顆裸 exe。
      - name: Attach bare exe for in-place update
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload ${{ github.ref_name }} src-tauri/target/release/kz-login.exe
