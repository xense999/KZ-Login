[package]
name = "kz-login"
version = "0.1.0"
description = "久世登入器"
authors = []
edition = "2021"

[lib]
name = "kz_login_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-store = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["json", "cookies", "rustls-tls"], default-features = false }
reqwest_cookie_store = "0.8"
cookie_store = "0.21"
chrono = { version = "0.4", features = ["serde"] }
tokio = { version = "1", features = ["full"] }
des = "0.8"
ecb = "0.1"
cipher = { version = "0.4", features = ["block-padding"] }
hex = "0.4"
base64 = "0.22"
regex = "1"
thiserror = "1"
sha2 = "0.10"

[target.'cfg(windows)'.dependencies]
winreg = "0.52"
# 把登入 session 的 cookie 寫進分頁 webview：Tauri 只能讀 cookie，寫要走
# WebView2 自己的 cookie manager。版本要跟著 tauri-runtime-wry 拉進來的那份。
webview2-com = "0.38"
windows-core = "0.61"
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_System_Registry",
] }
