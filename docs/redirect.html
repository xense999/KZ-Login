<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, nofollow" />
  <meta name="referrer" content="no-referrer" />
  <title>久世登入器 — 開啟登入</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft JhengHei", sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 18px;
      padding: 24px;
      background: #f2f2f7;
      color: #1c1c1e;
      text-align: center;
    }
    .icon {
      width: 64px; height: 64px;
      border-radius: 16px;
      background: #fff;
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 4px 16px rgba(0,0,0,0.1);
    }
    h1 { font-size: 18px; font-weight: 600; }
    p { font-size: 14px; color: #636366; line-height: 1.5; }
    a.btn {
      display: inline-block;
      margin-top: 4px;
      padding: 14px 28px;
      background: #007aff;
      color: #fff;
      font-size: 16px;
      font-weight: 600;
      text-decoration: none;
      border-radius: 12px;
    }
    .err { color: #ff3b30; font-size: 13px; }
  </style>
</head>
<body>
  <div class="icon">
    <svg viewBox="0 0 24 24" width="36" height="36" fill="none" stroke="#007aff" stroke-width="1.6">
      <rect x="3" y="3" width="7" height="7" rx="1.5"/>
      <rect x="14" y="3" width="7" height="7" rx="1.5"/>
      <rect x="3" y="14" width="7" height="7" rx="1.5"/>
      <rect x="14" y="14" width="3" height="3" rx="0.5"/>
      <rect x="18" y="18" width="3" height="3" rx="0.5"/>
    </svg>
  </div>
  <h1>正在開啟登入…</h1>
  <p id="hint">即將自動開啟 APP，若沒反應請點下方按鈕</p>
  <a id="open" class="btn" href="#" style="display:none">手動開啟登入</a>

  <script>
    // Three link formats, newest first. Older app versions and links already
    // sent out keep working because this page is shared by every version.
    //   ?c=<base64url>  login code only; the fixed deeplink prefix is restored here
    //   ?d=<base64url>  whole deeplink, used when the prefix is not the known one
    //   #<base64>       legacy; LINE stops linkifying a long URL at the "#"
    // The query string reaches the GitHub Pages server, unlike the fragment —
    // accepted: the code is short-lived, single-use, and already sits in the
    // chat message it was sent through.
    // Must stay in sync with DEEPLINK_PREFIX in src/pages/QrPage.vue. Never
    // edit the value: "?c=" links from every app version depend on it. A new
    // prefix needs a new parameter name.
    var DEEPLINK_PREFIX = "gameplapp://gameplhost/deeplink?type=1&action=web&code=";

    function fromBase64Url(s) {
      s = s.replace(/-/g, "+").replace(/_/g, "/");
      while (s.length % 4) s += "=";
      return s;
    }

    var dl = "";
    try {
      var q = new URLSearchParams(location.search);
      if (q.get("c")) {
        var code = fromBase64Url(q.get("c"));
        if (/^[A-Za-z0-9+/]+={0,2}$/.test(code)) dl = DEEPLINK_PREFIX + encodeURIComponent(code);
      } else if (q.get("d")) {
        dl = decodeURIComponent(escape(atob(fromBase64Url(q.get("d")))));
      } else {
        dl = decodeURIComponent(escape(atob(location.hash.slice(1))));
      }
    } catch (_) {}

    // Only the app's own scheme: anything else decoded from a crafted link
    // (javascript:, data:) would run on this origin.
    if (dl.indexOf("gameplapp://") === 0) {
      var btn = document.getElementById("open");
      btn.href = dl;            // anchor keeps the URL untouched as a fallback
      btn.style.display = "inline-block";
      // Auto-trigger the app
      location.href = dl;
    } else {
      document.getElementById("hint").innerHTML =
        '<span class="err">連結無效或已過期，請回到久世登入器重新取得。</span>';
    }
  </script>
</body>
</html>
